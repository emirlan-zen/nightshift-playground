version: "2"

run:
  timeout: 5m

linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
  settings:
    errcheck:
      exclude-functions:
        - (*database/sql.Tx).Rollback
  exclusions:
    # std-error-handling waives errcheck on the universally-ignored calls
    # (defer Close, Tx.Rollback, fmt.Print* to stdio) so the config matches the
    # codebase's existing idiom instead of forcing churn.
    presets:
      - std-error-handling
    rules:
      # Tests intentionally ignore returns on setup/seed calls.
      - path: _test\.go
        linters:
          - errcheck

formatters:
  enable:
    - gofmt
