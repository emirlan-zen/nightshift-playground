# Monitoring stack — Beszel (host+container metrics) + Dozzle (live logs).
# Behind Traefik, auth-gated. Deployed to ~/monitoring on the box.
# install.sh replaces __PREVIEW_DOMAIN__ while staging this file.
services:
  beszel:
    image: henrygd/beszel:latest
    restart: unless-stopped
    networks: [web]
    volumes:
      - ./beszel_data:/beszel_data
      - ./beszel_socket:/beszel_socket
    labels:
      - traefik.enable=true
      - "traefik.http.routers.beszel.rule=Host(`status.__PREVIEW_DOMAIN__`)"
      - traefik.http.routers.beszel.entrypoints=websecure
      - traefik.http.routers.beszel.tls.certresolver=le
      - traefik.http.services.beszel.loadbalancer.server.port=8090

  beszel-agent:
    image: henrygd/beszel-agent:latest
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./beszel_agent_data:/var/lib/beszel-agent
      - ./beszel_socket:/beszel_socket
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      LISTEN: /beszel_socket/beszel.sock
      HUB_URL: http://localhost:8090
      # filled after first-run "Add System" in the Beszel UI (see SETUP.md)
      TOKEN: ${BESZEL_TOKEN:-}
      KEY: ${BESZEL_KEY:-}

  dozzle:
    image: amir20/dozzle:latest
    restart: unless-stopped
    networks: [web]
    environment:
      DOZZLE_AUTH_PROVIDER: simple
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /etc/nightshift/secrets/dozzle-users.yml:/data/users.yml:ro
    labels:
      - traefik.enable=true
      - "traefik.http.routers.dozzle.rule=Host(`logs.__PREVIEW_DOMAIN__`)"
      - traefik.http.routers.dozzle.entrypoints=websecure
      - traefik.http.routers.dozzle.tls.certresolver=le
      - traefik.http.services.dozzle.loadbalancer.server.port=8080

networks:
  web:
    external: true
