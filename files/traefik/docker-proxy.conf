# nginx sidecar: Traefik's docker client pins API /v1.24/, which Docker 29
# (min API 1.40) rejects. Rewrite any /v1.<n>/ prefix to a supported version,
# then forward to the docker socket. Lets Traefik's docker provider work
# unmodified against new Docker daemons.
user root;   # workers need access to the root-owned docker socket
events {}
http {
  upstream docker { server unix:/var/run/docker.sock; }

  server {
    listen 2375;

    # streaming endpoints (events) must not buffer
    proxy_buffering off;
    proxy_read_timeout 3600s;
    proxy_http_version 1.1;

    location / {
      rewrite ^/v1\.[0-9]+/(.*)$ /v1.44/$1 break;
      proxy_pass http://docker;
    }
  }
}
